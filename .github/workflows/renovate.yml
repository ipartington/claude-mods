name: Renovate

on:
  schedule:
    - cron: "0 2 * * 1" # 02:00 UTC every Monday
  workflow_dispatch: # allow manual runs

jobs:
  renovate:
    name: Renovate dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Fail loudly on an invalid renovate.json. The Renovate run itself exits 0
      # even when it rejects the repo config ("config-validation"), so without
      # this gate a broken config silently ships as a green build. Pinned to the
      # same Renovate major the action below defaults to.
      - name: Validate Renovate config
        run: npx --yes --package renovate@44 -- renovate-config-validator --strict

      - name: Renovate
        uses: renovatebot/github-action@v46.3.6
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Without this Renovate finds no repositories and exits 0 having done nothing.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
